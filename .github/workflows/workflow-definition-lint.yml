name: CraftDroid Workflow Definition Lint
run-name: CraftDroid workflow lint - ${{ github.sha }}

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Actionlint
        shell: bash
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          test -x ./actionlint

      - name: Validate resilient build workflow
        shell: bash
        run: |
          set -euo pipefail
          ./actionlint -no-color .github/workflows/step406-resilient-build.yml

      - name: Inspect archived JVM launch bridge
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/craftdroid-archive
          mkdir -p /tmp/craftdroid-archive
          unzip -q CraftDroid_Launcher_2.4_GitHubActions_Step153.zip -d /tmp/craftdroid-archive
          echo '--- NativeGameBridge launch declarations ---'
          grep -RIn --include='*.kt' --include='*.java' 'fun launchJava\|launchJava(' /tmp/craftdroid-archive/app/src/main 2>/dev/null | head -80 || true
          echo '--- JVM argument references ---'
          grep -RIn --include='*.kt' --include='*.java' 'Xmx\|Xms\|jvmArgs\|javaArgs\|runtimeArgs' /tmp/craftdroid-archive/app/src/main 2>/dev/null | head -120 || true
          echo '--- LaunchCommandBuilder.kt ---'
          builder="$(find /tmp/craftdroid-archive/app/src/main -type f -name LaunchCommandBuilder.kt -print -quit)"
          test -n "$builder"
          sed -n '1,180p' "$builder"
          echo '--- settings / RAM configuration declarations ---'
          grep -RIn --include='*.kt' 'data class .*Settings\|data class .*Config\|ramMb\|minRamMb\|customJvmArgs' /tmp/craftdroid-archive/app/src/main/java 2>/dev/null | head -220 || true
