name: Verify Real Minecraft Android Boot

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build CraftDroid APK"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  boot:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Install Python dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --quiet --upgrade pip

      - name: Download and materialize real Minecraft 1.21.1 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/fixture
          CRAFTDROID_FIXTURE_DIR="$GITHUB_WORKSPACE/artifacts/fixture" \
            python3 tools/ci/verify_minecraft_install_fixture.py | tee artifacts/fixture/fixture-result.txt
          test -s artifacts/fixture/versions/1.21.1/1.21.1.jar
          test -s artifacts/fixture/versions/1.21.1/1.21.1.json
          test -s artifacts/fixture/assets/indexes/*.json
          find artifacts/fixture/libraries -type f -print -quit | grep -q .

      - name: Locate APK from the exact successful build run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/apk
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="CraftDroid-debug-apk" and .expired==false) | .id' | head -n 1 > artifacts/apk/artifact-id.txt
          else
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=50" --jq '.artifacts[] | select(.name=="CraftDroid-debug-apk" and .expired==false) | [.id,.workflow_run.head_sha] | @tsv' | awk -v sha="${GITHUB_SHA}" '$2==sha{print $1; exit}' > artifacts/apk/artifact-id.txt
          fi
          test -s artifacts/apk/artifact-id.txt
          ARTIFACT_ID="$(cat artifacts/apk/artifact-id.txt)"
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > artifacts/apk/artifact.zip
          unzip -q artifacts/apk/artifact.zip -d artifacts/apk
          APK="$(find artifacts/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Start Android emulator and run Step 182 real boot harness
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 3G
          heap-size: 512M
          ram-size: 1536M
          cores: 2
          avd-name: craftdroid-real-boot
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          disable-linux-hw-accel: auto
          enable-hw-keyboard: false
          channel: stable
          script: |
            mkdir -p artifacts/runtime
            bash tools/ci/real_minecraft_boot_step182.sh "$APK" artifacts/runtime artifacts/fixture

      - name: Upload Step 182 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CraftDroid-step182-real-minecraft-boot
          path: artifacts/runtime/**
          if-no-files-found: ignore

      - name: Upload Minecraft fixture summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CraftDroid-step182-minecraft-fixture
          path: artifacts/fixture/fixture-result.txt
          if-no-files-found: ignore
