name: Verify Real Minecraft Android Boot

on:
  workflow_dispatch:
    inputs:
      apk_build_run_id:
        description: 'Successful authoritative APK build run ID (optional; Step296 finalizer run is supported)'
        required: false
        type: string
  workflow_run:
    workflows: ["Step 296 - Authoritative APK finalizer loop"]
    types: [completed]
    branches: [main, master]

permissions:
  contents: read
  actions: read

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Select source commit
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            TARGET_SHA='${{ github.event.workflow_run.head_sha }}'
            SOURCE_RUN_ID='${{ github.event.workflow_run.id }}'
          else
            TARGET_SHA="$GITHUB_SHA"
            SOURCE_RUN_ID='${{ inputs.apk_build_run_id }}'
          fi
          printf '%s\n' "$TARGET_SHA" > target-sha.txt
          printf '%s\n' "$SOURCE_RUN_ID" > source-run-id.txt
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"

      - name: Wait for authoritative build to finish successfully
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_RUN_ID"
          for attempt in $(seq 1 120); do
            RUN_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$SOURCE_RUN_ID")"
            STATUS="$(printf '%s' "$RUN_JSON" | jq -r '.status // empty')"
            CONCLUSION="$(printf '%s' "$RUN_JSON" | jq -r '.conclusion // empty')"
            HEAD_SHA="$(printf '%s' "$RUN_JSON" | jq -r '.head_sha // empty')"
            echo "authoritative build poll $attempt/120: status=$STATUS conclusion=$CONCLUSION sha=$HEAD_SHA"
            if [ "$STATUS" = "completed" ]; then
              test "$CONCLUSION" = success
              test "$HEAD_SHA" = "$TARGET_SHA"
              break
            fi
            sleep 15
          done
          FINAL="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$SOURCE_RUN_ID" | jq -r '.conclusion // empty')"
          test "$FINAL" = success

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Download and materialize real Minecraft 1.21.1 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/fixture
          CRAFTDROID_FIXTURE_DIR="$GITHUB_WORKSPACE/artifacts/fixture" \
            python3 tools/ci/verify_minecraft_install_fixture.py | tee artifacts/fixture/fixture-result.txt
          test -s artifacts/fixture/versions/1.21.1/1.21.1.jar
          test -s artifacts/fixture/versions/1.21.1/1.21.1.json
          test -s artifacts/fixture/assets/indexes/*.json
          find artifacts/fixture/libraries -type f -print -quit | grep -q .

      - name: Validate and download APK build artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/apk
          found=''
          BUILD_SHA=''
          BUILD_STATUS=''
          if [ -n "$SOURCE_RUN_ID" ]; then
            echo "Inspecting APK build run $SOURCE_RUN_ID."
            RUN_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$SOURCE_RUN_ID")"
            BUILD_SHA="$(printf '%s' "$RUN_JSON" | jq -r '.head_sha // empty')"
            BUILD_STATUS="$(printf '%s' "$RUN_JSON" | jq -r '.conclusion // empty')"
            printf '%s\n' "$BUILD_SHA" > artifacts/apk/build-head-sha.txt
            printf '%s\n' "$BUILD_STATUS" > artifacts/apk/build-conclusion.txt
            test "$BUILD_STATUS" = success
            test "$BUILD_SHA" = "$TARGET_SHA" || {
              echo "APK build run $SOURCE_RUN_ID targets $BUILD_SHA but boot test targets $TARGET_SHA." >&2
              exit 1
            }
            found="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
              --jq '.artifacts[] | select((.name|startswith("Droid-Launcher-Step")) and ((.name|endswith("-debug")) or (.name|endswith("-final"))) and .expired==false) | .id' \
              | head -n 1)"
          fi
          if [ -z "$found" ]; then
            echo "Falling back to exact source-commit artifact lookup for $TARGET_SHA."
            found="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select((.name|startswith("Droid-Launcher-Step")) and ((.name|endswith("-debug")) or (.name|endswith("-final"))) and .expired==false) | [.id,.workflow_run.head_sha,.workflow_run.conclusion] | @tsv' \
              | awk -v sha="$TARGET_SHA" '$2==sha && $3=="success" {print $1; exit}')"
            printf '%s\n' "$TARGET_SHA" > artifacts/apk/build-head-sha.txt
            printf '%s\n' "success" > artifacts/apk/build-conclusion.txt
          fi
          test -n "$found"
          printf '%s\n' "$found" > artifacts/apk/artifact-id.txt
          printf '%s\n' "$TARGET_SHA" > artifacts/apk/source-sha.txt
          printf '%s\n' "${SOURCE_RUN_ID:-auto-by-source-commit}" > artifacts/apk/source-run-id.txt
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$found/zip" > artifacts/apk/artifact.zip
          unzip -q artifacts/apk/artifact.zip -d artifacts/apk
          APK="$(find artifacts/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Record launch-test identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "target_sha=$TARGET_SHA"
            echo "source_run_id=${SOURCE_RUN_ID:-none}"
            echo "apk=$(basename "$APK")"
          } | tee artifacts/apk/test-identity.txt

      - name: Install Android SDK command-line packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "build-tools;36.0.0" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Install emulator host runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          ldconfig -p | grep -q 'libpulse.so.0'

      - name: Preflight APK for x86_64 Android emulator
        shell: bash
        run: |
          set -euo pipefail
          APK_MANIFEST="$GITHUB_WORKSPACE/artifacts/apk/apk-badging.txt"
          APK_ABIS="$GITHUB_WORKSPACE/artifacts/apk/apk-native-libs.txt"
          SHA_FILE="$GITHUB_WORKSPACE/artifacts/apk/apk-sha256.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee "$APK_MANIFEST"
          PACKAGE="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$APK_MANIFEST" | head -n1)"
          ACTIVITY="$(sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" "$APK_MANIFEST" | head -n1)"
          test -n "$PACKAGE"
          test -n "$ACTIVITY"
          printf '%s\n' "$PACKAGE" > artifacts/apk/package.txt
          printf '%s\n' "$ACTIVITY" > artifacts/apk/activity.txt
          sha256sum "$APK" | tee "$SHA_FILE"
          unzip -l "$APK" | awk '{print $4}' | grep '^lib/x86_64/' | tee "$APK_ABIS"
          grep -q 'lib/x86_64/libcraftdroidbridge.so$' "$APK_ABIS"
          test -s artifacts/apk/apk-native-libs.txt
          {
            echo "package=$PACKAGE"
            echo "activity=$ACTIVITY"
            echo "required_abi=x86_64"
            echo "required_native=lib/x86_64/libcraftdroidbridge.so"
          } | tee artifacts/apk/apk-preflight.txt

      - name: Verify emulator prerequisites
        shell: bash
        run: |
          set -euo pipefail
          emulator -version
          adb version
          test -d "$ANDROID_HOME/system-images/android-35/google_apis/x86_64"

      - name: Start Android emulator and run Step 190 real boot harness
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 4G
          heap-size: 512M
          ram-size: 1536M
          cores: 2
          avd-name: craftdroid-real-boot
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          enable-hw-keyboard: false
          channel: stable
          script: |
            set -euo pipefail
            mkdir -p artifacts/runtime
            adb shell getprop ro.product.cpu.abi | tee artifacts/runtime/emulator-abi.txt
            adb shell getprop ro.build.version.sdk | tee artifacts/runtime/emulator-api.txt
            adb wait-for-device
            bash tools/ci/real_minecraft_boot_step182.sh "$APK" artifacts/runtime artifacts/fixture

      - name: Upload Step 196 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CraftDroid-step196-real-minecraft-boot
          path: artifacts/runtime/**
          if-no-files-found: ignore

      - name: Upload Minecraft fixture summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CraftDroid-step196-minecraft-fixture
          path: artifacts/fixture/fixture-result.txt
          if-no-files-found: ignore

      - name: Upload APK preflight and identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CraftDroid-step196-apk-preflight
          path: artifacts/apk/*
          if-no-files-found: ignore
