name: Verify Real Minecraft Android Boot

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build CraftDroid APK]
    types: [completed]
    branches: [main, master]

permissions:
  contents: read
  actions: read

jobs:
  boot:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Select source commit
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            TARGET_SHA='${{ github.event.workflow_run.head_sha }}'
          else
            TARGET_SHA="$GITHUB_SHA"
          fi
          printf '%s\n' "$TARGET_SHA" > target-sha.txt
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Download and materialize real Minecraft 1.21.1 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/fixture
          CRAFTDROID_FIXTURE_DIR="$GITHUB_WORKSPACE/artifacts/fixture" \
            python3 tools/ci/verify_minecraft_install_fixture.py | tee artifacts/fixture/fixture-result.txt
          test -s artifacts/fixture/versions/1.21.1/1.21.1.jar
          test -s artifacts/fixture/versions/1.21.1/1.21.1.json
          test -s artifacts/fixture/assets/indexes/*.json
          find artifacts/fixture/libraries -type f -print -quit | grep -q .

      - name: Download APK built from the exact source commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/apk
          found=''
          echo "Looking for CraftDroid-debug-apk built from $TARGET_SHA."
          for attempt in $(seq 1 12); do
            found="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name=="CraftDroid-debug-apk" and .expired==false) | [.id,.workflow_run.head_sha,.workflow_run.conclusion] | @tsv' \
              | awk -v sha="$TARGET_SHA" '$2==sha && $3=="success" {print $1; exit}')"
            if [ -n "$found" ]; then break; fi
            sleep 15
          done
          test -n "$found"
          printf '%s\n' "$found" > artifacts/apk/artifact-id.txt
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$found/zip" > artifacts/apk/artifact.zip
          unzip -q artifacts/apk/artifact.zip -d artifacts/apk
          APK="$(find artifacts/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Start Android emulator and run Step 187 real boot harness
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 3G
          heap-size: 512M
          ram-size: 1536M
          cores: 2
          avd-name: craftdroid-real-boot
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          enable-hw-keyboard: false
          channel: stable
          script: |
            mkdir -p artifacts/runtime
            bash tools/ci/real_minecraft_boot_step182.sh "$APK" artifacts/runtime artifacts/fixture

      - name: Upload Step 187 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CraftDroid-step187-real-minecraft-boot
          path: artifacts/runtime/**
          if-no-files-found: ignore

      - name: Upload Minecraft fixture summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CraftDroid-step187-minecraft-fixture
          path: artifacts/fixture/fixture-result.txt
          if-no-files-found: ignore
