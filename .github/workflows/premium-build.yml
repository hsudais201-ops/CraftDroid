name: Droid Launcher Premium Rebuild

on:
  push:
    branches: [premium-rebuild]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/premium-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Gradle help
        run: ./gradlew --no-daemon help

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Kotlin and native compile
        run: ./gradlew --no-daemon compileDebugKotlin externalNativeBuildDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK package
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.craftdroid.launcher'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "launchable-activity"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: droid-launcher-premium-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  emulator-smoke:
    needs: build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: droid-launcher-premium-debug
          path: apk

      - name: Start Android emulator and smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          ram-size: 3072M
          disk-size: 2048M
          cores: 2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -e
            APK="$(find apk -name '*.apk' | head -1)"
            adb install -r "$APK"
            adb shell pm clear com.craftdroid.launcher
            adb shell am force-stop com.craftdroid.launcher
            adb shell monkey -p com.craftdroid.launcher 1
            sleep 10
            adb shell dumpsys package com.craftdroid.launcher | grep -q "versionName"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb shell cat /sdcard/window.xml | grep -q "Welcome to Droid Launcher"

            echo "Running Android instrumentation smoke tests against the real emulator"
            ./gradlew --no-daemon connectedDebugAndroidTest               -Pandroid.testInstrumentationRunnerArguments.class=com.example.RuntimeRendererSmokeTest

            if adb logcat -d -v brief | grep -E "FATAL EXCEPTION|AndroidRuntime.*FATAL" ; then
              echo "Fatal Android exception detected"
              exit 1
            fi

      - name: Smoke artifact metadata
        if: always()
        run: |
          echo "Premium rebuild smoke test completed for commit $GITHUB_SHA"
