name: CraftDroid APK — legacy/manual validation

# The authoritative Droid Launcher build is step200-droid-launcher-build.yml.
# This older validation workflow is manual-only to prevent duplicate push builds.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: craftdroid-legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify real Minecraft Android boot harness contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/verify_real_boot_harness_contract.py .

      - name: Locate and extract CraftDroid source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find . -maxdepth 2 -type f -name 'CraftDroid_Launcher_2.4_GitHubActions_Step153.zip' -print -quit)"
          test -n "$ARCHIVE"
          rm -rf craftdroid-src
          mkdir -p craftdroid-src
          unzip -q "$ARCHIVE" -d craftdroid-src
          if [ ! -f craftdroid-src/gradlew ]; then
            PROJECT_DIR="$(find craftdroid-src -type f -name gradlew -print -quit | xargs -r dirname)"
            test -n "$PROJECT_DIR"
            shopt -s dotglob
            mv "$PROJECT_DIR"/* craftdroid-src/
            rmdir "$PROJECT_DIR"
          fi
          mkdir -p craftdroid-src/app/src/main/java/com/example/launcher
          cp -f app/src/main/java/com/example/launcher/MinecraftVersionInstallManager.kt craftdroid-src/app/src/main/java/com/example/launcher/MinecraftVersionInstallManager.kt

      - name: Normalize Gradle settings for CI
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="craftdroid-src/settings.gradle.kts"
          if [ -f "$SETTINGS" ]; then
            sed -i '/org\.gradle\.toolchains\.foojay-resolver-convention/d' "$SETTINGS"
          fi

      - name: Apply legacy source repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/apply_droid_launcher_branding.py craftdroid-src
          python3 tools/ci/repair_step153.py craftdroid-src
          python3 tools/ci/repair_step154_tests.py craftdroid-src
          python3 tools/ci/repair_step155_cpp.py craftdroid-src
          python3 tools/ci/repair_step223_install_status_ui.py craftdroid-src

      - name: Validate legacy Gradle project
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Install Gradle 9.6.0 directly
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          validate-wrappers: false
      - name: Gradle help
        working-directory: craftdroid-src
        run: gradle --no-daemon --stacktrace help
      - name: Legacy unit tests
        working-directory: craftdroid-src
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Legacy debug APK build
        working-directory: craftdroid-src
        run: gradle --no-daemon --stacktrace :app:assembleDebug
