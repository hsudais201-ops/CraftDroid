name: Build CraftDroid APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: craftdroid-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate CraftDroid source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find . -maxdepth 2 -type f -name 'CraftDroid_Launcher_2.4_GitHubActions_Step153.zip' -print -quit)"
          test -n "$ARCHIVE" || { echo 'CraftDroid Step 153 source archive not found.' >&2; exit 1; }
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "Using $ARCHIVE"

      - name: Extract CraftDroid source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf craftdroid-src
          mkdir -p craftdroid-src
          unzip -q "$ARCHIVE" -d craftdroid-src
          test -f craftdroid-src/gradlew
          test -f craftdroid-src/gradle/wrapper/gradle-wrapper.properties
          chmod +x craftdroid-src/gradlew
          echo '--- extracted project root ---'
          find craftdroid-src -maxdepth 1 -mindepth 1 -printf '%f\n' | sort

      - name: Normalize Gradle settings for CI
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="craftdroid-src/settings.gradle.kts"
          test -f "$SETTINGS"
          # The source archive requests the Foojay toolchain resolver, but CraftDroid
          # already builds against the JDK supplied by GitHub Actions. Removing the
          # optional resolver avoids an unnecessary plugin-resolution dependency.
          sed -i '/org\.gradle\.toolchains\.foojay-resolver-convention/d' "$SETTINGS"
          echo '--- normalized settings.gradle.kts ---'
          sed -n '1,60p' "$SETTINGS"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Gradle project
        working-directory: craftdroid-src
        run: ./gradlew --no-daemon --stacktrace help

      - name: Run unit tests
        working-directory: craftdroid-src
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: craftdroid-src
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="craftdroid-src/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p artifacts/apk
          cp "$APK" artifacts/apk/
          sha256sum "$APK" | tee artifacts/apk/SHA256SUMS.txt
          echo '--- APK ---'
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CraftDroid-debug-apk
          path: artifacts/apk/*
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CraftDroid-build-diagnostics
          path: |
            craftdroid-src/app/build/reports/**
            craftdroid-src/app/build/test-results/**
          if-no-files-found: ignore
