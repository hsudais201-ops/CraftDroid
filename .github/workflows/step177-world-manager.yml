name: Step 177 World Manager

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find . -maxdepth 2 -type f -name 'CraftDroid_Launcher_2.4_GitHubActions_Step153.zip' -print -quit)"
          test -n "$ARCHIVE"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf craftdroid-src
          mkdir craftdroid-src
          unzip -q "$ARCHIVE" -d craftdroid-src
          if [ ! -f craftdroid-src/gradlew ]; then
            PROJECT_DIR="$(find craftdroid-src -type f -name gradlew -print -quit | xargs -r dirname)"
            test -n "$PROJECT_DIR"
            shopt -s dotglob
            mv "$PROJECT_DIR"/* craftdroid-src/
            rmdir "$PROJECT_DIR"
          fi

      - name: Apply Step 177 World & Save Manager
        run: python3 tools/ci/apply_step177_world_manager.py craftdroid-src

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.6.0 directly
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Compile and run Step 177 tests
        working-directory: craftdroid-src
        shell: bash
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest --tests com.example.launcher.WorldManagerStep177Test
