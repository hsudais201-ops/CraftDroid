name: Step 177 World Manager

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: step177-world-manager-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find . -maxdepth 2 -type f -name 'CraftDroid_Launcher_2.4_GitHubActions_Step153.zip' -print -quit)"
          test -n "$ARCHIVE"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf craftdroid-src
          mkdir craftdroid-src
          unzip -q "$ARCHIVE" -d craftdroid-src
          if [ ! -f craftdroid-src/gradlew ]; then
            PROJECT_DIR="$(find craftdroid-src -type f -name gradlew -print -quit | xargs -r dirname)"
            test -n "$PROJECT_DIR"
            shopt -s dotglob
            mv "$PROJECT_DIR"/* craftdroid-src/
            rmdir "$PROJECT_DIR"
          fi

      - name: Copy shared launcher implementation sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p craftdroid-src/app/src/main/java/com/example/launcher
          mkdir -p craftdroid-src/app/src/main/java/com/example/renderer
          mkdir -p craftdroid-src/app/src/main/java/com/example/logs
          for f in LaunchArgumentResolver.kt LaunchArgumentsValidator.kt LaunchArtifactResolver.kt MinecraftStorageResolver.kt MinecraftVersionInstallManager.kt MinecraftLaunchPaths.kt MinecraftLaunchCommandBuilder.kt MinecraftLaunchHandoff.kt MinecraftLaunchHandoffValidator.kt; do cp -f "app/src/main/java/com/example/launcher/$f" "craftdroid-src/app/src/main/java/com/example/launcher/$f"; done
          cp -f app/src/main/java/com/example/renderer/PerformanceProfile.kt craftdroid-src/app/src/main/java/com/example/renderer/PerformanceProfile.kt
          cp -f app/src/main/java/com/example/renderer/MinecraftPerformanceTuner.kt craftdroid-src/app/src/main/java/com/example/renderer/MinecraftPerformanceTuner.kt
          cp -f app/src/main/java/com/example/logs/MinecraftProcessMonitor.kt craftdroid-src/app/src/main/java/com/example/logs/MinecraftProcessMonitor.kt

      - name: Apply Steps 153-155 base compatibility repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/repair_step153.py craftdroid-src
          python3 tools/ci/repair_step154_tests.py craftdroid-src
          python3 tools/ci/repair_step155_cpp.py craftdroid-src

      - name: Apply Step 177 World & Save Manager
        run: python3 tools/ci/apply_step177_world_manager.py craftdroid-src

      - name: Repair Step 242 World Manager test compatibility
        run: python3 tools/ci/repair_step242_world_manager_test_junit.py craftdroid-src

      - name: Repair Step 243 core unit contracts
        run: python3 tools/ci/repair_step243_core_unit_contracts.py craftdroid-src

      - name: Apply Step 202 Kotlin compile repairs
        run: python3 tools/ci/repair_step202_kotlin.py craftdroid-src

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.6.0 directly
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          validate-wrappers: false

      - name: Compile and run Step 177 tests
        working-directory: craftdroid-src
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest --tests com.example.launcher.WorldManagerStep177Test 2>&1 | tee ../step177-test.log

      - name: Upload Step 177 test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Step177-test-log
          path: step177-test.log
          if-no-files-found: ignore
