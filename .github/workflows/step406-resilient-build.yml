name: Step 257 - Droid Launcher resilient authoritative build
run-name: Step 257 Droid Launcher build - ${{ github.sha }}

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: step257-resilient-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate CI helper scripts
        run: python3 -m compileall -q tools/ci

      - name: Prepare generated launcher source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf droid-src artifacts
          mkdir -p droid-src artifacts/build artifacts/apk
          unzip -q CraftDroid_Launcher_2.4_GitHubActions_Step153.zip -d droid-src
          if [ ! -f droid-src/gradlew ]; then
            ROOT="$(find droid-src -type f -name gradlew -print0 -quit | xargs -0 -r dirname)"
            test -n "$ROOT"
            shopt -s dotglob
            mv "$ROOT"/* droid-src/
            rmdir "$ROOT"
          fi
          mkdir -p droid-src/app/src/main/java/com/example/launcher
          for f in LaunchArgumentResolver.kt LaunchArgumentsValidator.kt LaunchArtifactResolver.kt MinecraftStorageResolver.kt MinecraftVersionInstallManager.kt MinecraftLaunchPaths.kt MinecraftLaunchCommandBuilder.kt MinecraftLaunchHandoff.kt MinecraftLaunchHandoffValidator.kt; do
            cp -f "app/src/main/java/com/example/launcher/$f" "droid-src/app/src/main/java/com/example/launcher/$f"
          done
          for f in MinecraftRuntimeProfile.kt MinecraftLatestVersionManager.kt MinecraftContentManager.kt MinecraftModpackManager.kt MinecraftLoaderProfile.kt LauncherBackgroundInstallController.kt DroidLauncherUpdateManager.kt; do
            cp -f "app/src/main/java/com/example/launcher/$f" "droid-src/app/src/main/java/com/example/launcher/$f"
          done
          mkdir -p droid-src/app/src/main/java/com/example/logs droid-src/app/src/main/java/com/example/renderer
          cp -f app/src/main/java/com/example/logs/MinecraftProcessMonitor.kt droid-src/app/src/main/java/com/example/logs/MinecraftProcessMonitor.kt
          cp -f app/src/main/java/com/example/renderer/PerformanceProfile.kt droid-src/app/src/main/java/com/example/renderer/PerformanceProfile.kt
          cp -f app/src/main/java/com/example/renderer/MinecraftPerformanceTuner.kt droid-src/app/src/main/java/com/example/renderer/MinecraftPerformanceTuner.kt
          if [ -d app/src/main/assets ]; then
            mkdir -p droid-src/app/src/main/assets
            cp -a app/src/main/assets/. droid-src/app/src/main/assets/
          fi

      - name: Normalize Gradle settings for CI
        shell: bash
        run: |
          set -euo pipefail
          for SETTINGS in droid-src/settings.gradle.kts droid-src/settings.gradle; do
            if [ -f "$SETTINGS" ]; then sed -i '/org\.gradle\.toolchains\.foojay-resolver-convention/d' "$SETTINGS"; fi
          done

      - name: Apply Droid Launcher branding
        run: python3 tools/ci/apply_droid_launcher_branding.py droid-src

      - name: Apply Steps 153-155 base repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/repair_step153.py droid-src
          python3 tools/ci/repair_step154_tests.py droid-src
          python3 tools/ci/repair_step155_cpp.py droid-src

      - name: Apply Step 177 World Manager integration
        run: python3 tools/ci/apply_step177_world_manager.py droid-src
      - name: Repair Step 242 World Manager test compatibility
        run: python3 tools/ci/repair_step242_world_manager_test_junit.py droid-src
      - name: Repair Step 243 core unit contracts
        run: python3 tools/ci/repair_step243_core_unit_contracts.py droid-src
