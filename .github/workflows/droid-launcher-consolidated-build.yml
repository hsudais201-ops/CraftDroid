name: Droid Launcher — consolidated build

on:
  workflow_dispatch:
  push:
    paths:
      - 'CraftDroid_Launcher_2.4_GitHubActions_Step153.zip'
      - 'tools/ci/**'
      - '.github/workflows/droid-launcher-consolidated-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract launcher source artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .droid-source
          mkdir -p .droid-source
          unzip -q 'CraftDroid_Launcher_2.4_GitHubActions_Step153.zip' -d .droid-source
          echo 'Extracted source tree:'
          find .droid-source -maxdepth 3 -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'gradlew' \) -print

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(find .droid-source -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit | xargs -r dirname)
          if [ -z "${ROOT:-}" ]; then
            echo 'No Gradle settings file was found inside the launcher artifact.' >&2
            exit 1
          fi
          ROOT=$(realpath "$ROOT")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Gradle root: $ROOT"

      - name: Apply Droid Launcher branding
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/apply_droid_launcher_branding.py "${{ steps.locate.outputs.root }}"

      - name: Run source/preflight checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/build_droid_launcher_bundle.py "${{ steps.locate.outputs.root }}"

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail
          gradle --no-daemon clean test assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: droid-launcher-debug-apk
          path: |
            ${{ steps.locate.outputs.root }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
