name: Droid Launcher — legacy manual build

# The authoritative Droid Launcher build is .github/workflows/step200-droid-launcher-build.yml.
# Keep this older workflow available for manual comparison, but do not run it on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Gradle 9.6.0 directly
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          validate-wrappers: false
      - name: Extract launcher source artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .droid-source
          mkdir -p .droid-source
          unzip -q 'CraftDroid_Launcher_2.4_GitHubActions_Step153.zip' -d .droid-source
          ROOT=$(find .droid-source -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit | xargs -r dirname)
          test -n "$ROOT"
          ROOT=$(realpath "$ROOT")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Run legacy source check
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/build_droid_launcher_bundle.py "$ROOT"
      - name: Build debug APK
        working-directory: ${{ env.ROOT }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: droid-launcher-legacy-debug-apk
          path: ${{ env.ROOT }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
