name: Extract launcher source

on:
  push:
    branches: [main]
    paths:
      - 'CraftDroid_Launcher_2.4_GitHubActions_Step153.zip'
      - '.github/workflows/extract-launcher-source.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/launcher-unpack
          mkdir -p /tmp/launcher-unpack
          unzip -q "CraftDroid_Launcher_2.4_GitHubActions_Step153.zip" -d /tmp/launcher-unpack
          ROOT="$(dirname "$(find /tmp/launcher-unpack -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
          if [ -z "$ROOT" ] || [ "$ROOT" = "." ]; then
            echo "Could not locate Gradle project in archive"
            find /tmp/launcher-unpack -maxdepth 4 -type f | head -200
            exit 1
          fi
          rm -rf /tmp/extracted-project
          mkdir -p /tmp/extracted-project
          cp -a "$ROOT"/. /tmp/extracted-project/
          rm -rf extracted-source
          mkdir extracted-source
          cp -a /tmp/extracted-project/. extracted-source/

      - name: Publish extracted source branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan source-extracted
          git rm -rf . || true
          cp -a extracted-source/. .
          rm -rf extracted-source
          git add -A
          git commit -m "Extract Android launcher source from archive"
          git push --force origin HEAD:source-extracted
