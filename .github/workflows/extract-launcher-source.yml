name: Extract launcher source

on:
  push:
    branches: [main]
    paths:
      - 'CraftDroid_Launcher_2.4_GitHubActions_Step153.zip'
      - '.github/workflows/extract-launcher-source.yml'
      - 'tools/ci/repair_full_codebase_sweep.py'
      - 'tools/ci/repair_full_sweep_live_paths.py'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/launcher-unpack /tmp/extracted-project
          mkdir -p /tmp/launcher-unpack /tmp/extracted-project
          unzip -q "CraftDroid_Launcher_2.4_GitHubActions_Step153.zip" -d /tmp/launcher-unpack
          ROOT="$(dirname "$(find /tmp/launcher-unpack -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
          if [ -z "$ROOT" ] || [ "$ROOT" = "." ]; then
            echo "Could not locate Gradle project in archive"
            find /tmp/launcher-unpack -maxdepth 4 -type f | head -200
            exit 1
          fi
          cp -a "$ROOT"/. /tmp/extracted-project/
          # The archive contains CI workflow definitions. The Actions token used
          # here can publish normal source but cannot create/update workflow files.
          rm -rf /tmp/extracted-project/.github/workflows
          test -f /tmp/extracted-project/settings.gradle.kts
          test -f /tmp/extracted-project/app/build.gradle.kts
          test -f /tmp/extracted-project/app/src/main/AndroidManifest.xml
      - name: Apply full codebase sweep repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/repair_full_codebase_sweep.py /tmp/extracted-project
          python3 tools/ci/repair_full_sweep_live_paths.py /tmp/extracted-project
          python3 tools/ci/repair_full_sweep_second_pass.py /tmp/extracted-project


      - name: Publish complete Android source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan source-extracted
          git rm -rf . || true
          cp -a /tmp/extracted-project/. .
          git add -A
          git commit -m "Extract Android launcher source from archive"
          git push --force origin HEAD:source-extracted

      - name: Package extracted source
        run: |
          cd /tmp
          tar -czf craftdroid-source.tar.gz extracted-project

      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: craftdroid-source
          path: /tmp/craftdroid-source.tar.gz
          if-no-files-found: error
          retention-days: 7
