name: Step 257 - Droid Launcher resilient authoritative build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: step257-resilient-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate CI helper scripts
        run: python3 -m compileall -q tools/ci
      - name: Prepare generated launcher source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf droid-src artifacts
          mkdir -p droid-src artifacts/build artifacts/apk
          unzip -q CraftDroid_Launcher_2.4_GitHubActions_Step153.zip -d droid-src
          if [ ! -f droid-src/gradlew ]; then
            ROOT="$(find droid-src -type f -name gradlew -print -quit | xargs -r dirname)"
            test -n "$ROOT"
            shopt -s dotglob
            mv "$ROOT"/* droid-src/
            rmdir "$ROOT"
          fi
          mkdir -p droid-src/app/src/main/java/com/example/launcher
          for f in LaunchArgumentResolver.kt LaunchArgumentsValidator.kt LaunchArtifactResolver.kt MinecraftStorageResolver.kt MinecraftVersionInstallManager.kt MinecraftLaunchPaths.kt MinecraftLaunchCommandBuilder.kt MinecraftLaunchHandoff.kt MinecraftLaunchHandoffValidator.kt; do cp -f "app/src/main/java/com/example/launcher/$f" "droid-src/app/src/main/java/com/example/launcher/$f"; done
          cp -f app/src/main/java/com/example/logs/MinecraftProcessMonitor.kt droid-src/app/src/main/java/com/example/logs/MinecraftProcessMonitor.kt
          cp -f app/src/main/java/com/example/renderer/PerformanceProfile.kt droid-src/app/src/main/java/com/example/renderer/PerformanceProfile.kt
          cp -f app/src/main/java/com/example/renderer/MinecraftPerformanceTuner.kt droid-src/app/src/main/java/com/example/renderer/MinecraftPerformanceTuner.kt
          if [ -d app/src/main/assets ]; then
            mkdir -p droid-src/app/src/main/assets
            cp -a app/src/main/assets/. droid-src/app/src/main/assets/
          fi
      - name: Normalize Gradle settings for CI
        shell: bash
        run: |
          set -euo pipefail
          for SETTINGS in droid-src/settings.gradle.kts droid-src/settings.gradle; do
            if [ -f "$SETTINGS" ]; then sed -i '/org\.gradle\.toolchains\.foojay-resolver-convention/d' "$SETTINGS"; fi
          done
      - name: Apply Droid Launcher branding
        run: python3 tools/ci/apply_droid_launcher_branding.py droid-src
      - name: Apply Steps 153-155 base repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/repair_step153.py droid-src
          python3 tools/ci/repair_step154_tests.py droid-src
          python3 tools/ci/repair_step155_cpp.py droid-src
      - name: Apply Step 177 World Manager integration
        run: python3 tools/ci/apply_step177_world_manager.py droid-src
      - name: Repair Step 242 World Manager test compatibility
        run: python3 tools/ci/repair_step242_world_manager_test_junit.py droid-src
      - name: Repair Step 243 core unit contracts
        run: python3 tools/ci/repair_step243_core_unit_contracts.py droid-src
      - name: Apply Step 202 Kotlin compile repairs
        run: python3 tools/ci/repair_step202_kotlin.py droid-src
      - name: Apply Step 205 Droid Launcher UI generation
        run: python3 tools/ci/apply_step205_droid_launcher_ui.py droid-src
      - name: Repair Step 205 UI wiring
        run: python3 tools/ci/repair_step205_ui.py droid-src
      - name: Apply Step 253 comprehensive Feature Center
        run: python3 tools/ci/apply_step253_feature_center.py droid-src
      - name: Apply Steps 207-216 server and launch UI
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/repair_step207_server_ui.py droid-src
          python3 tools/ci/repair_step209_server_list.py droid-src
          python3 tools/ci/repair_step210_server_launch.py droid-src
          python3 tools/ci/repair_step211_minecraft_server_query.py droid-src
          python3 tools/ci/repair_step212_server_ui.py droid-src
          python3 tools/ci/repair_step213_server_cards.py droid-src
          python3 tools/ci/repair_step214_server_detail.py droid-src
          python3 tools/ci/repair_step215_launch_feedback.py droid-src
          python3 tools/ci/repair_step216_launch_progress.py droid-src
      - name: Apply Steps 217-220 Java/runtime binding
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/repair_step217_java_runtime_ui.py droid-src
          python3 tools/ci/repair_step218_java_profile.py droid-src
          python3 tools/ci/repair_step219_launch_java_binding.py droid-src
          python3 tools/ci/repair_step220_version_launch_binding.py droid-src
      - name: Apply Steps 221-230 install and launch preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/repair_step221_version_selector.py droid-src
          python3 tools/ci/repair_step222_version_install.py droid-src
          python3 tools/ci/repair_step223_install_status_ui.py droid-src
          python3 tools/ci/repair_step224_launch_preflight.py droid-src
          python3 tools/ci/repair_step225_launch_paths.py droid-src
          python3 tools/ci/repair_step226_storage_root.py droid-src
          python3 tools/ci/repair_step227_library_rules.py droid-src
          python3 tools/ci/repair_step228_install_resilience.py droid-src
          python3 tools/ci/repair_step229_install_progress_ui.py droid-src
          python3 tools/ci/repair_step230_complete_launch_preflight.py droid-src
      - name: Apply Steps 231-236 launch handoff and trust hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/repair_step231_launch_handoff.py droid-src
          python3 tools/ci/repair_step232_launch_handoff_consumer.py droid-src
          python3 tools/ci/repair_step234_handoff_validation_launch_gate.py droid-src
          python3 tools/ci/repair_step235_launch_runtime_guard.py droid-src
          python3 tools/ci/repair_step236_download_trust.py droid-src
      - name: Step 257 final Feature Center repair
        run: python3 tools/ci/repair_step257_feature_center_after_ui.py droid-src
      - name: Step 286 final Home and Account GUI
        run: python3 tools/ci/apply_step286_home_account_gui.py droid-src
      - name: Step 287 first-run launcher components GUI
        run: python3 tools/ci/apply_step287_first_run_components_gui.py droid-src
      - name: Repair final generated Kotlin after UI generation
        run: python3 tools/ci/repair_step292_first_run_compile.py droid-src
      - name: Reapply final server contracts after UI generation
        run: python3 tools/ci/repair_step293_server_contracts_after_final_ui.py droid-src
      - name: Restore Feature Center navigation after final UI replacement
        run: python3 tools/ci/repair_step295_final_navigation.py droid-src
      - name: Repair Android EditText property mappings
        run: python3 tools/ci/repair_step297_android_edittext_properties.py droid-src
      - name: Deep source quality pass - 1000 content-dependent checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/deep_quality_pass_1000.py droid-src
      - name: Verify generated source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/verify_minecraft_launch_contract.py droid-src
          python3 tools/ci/verify_step233_handoff_validator.py droid-src
          python3 tools/ci/verify_step235_audit.py droid-src
          python3 tools/ci/verify_step236_download_trust.py droid-src
          python3 tools/ci/verify_step239_generated_kotlin.py droid-src
          python3 tools/ci/verify_step287_first_run_components.py droid-src
          grep -F 'private fun showBootstrapGate()' droid-src/app/src/main/java/com/example/launcher/DroidLauncherUiActivity.kt
          grep -F 'private fun showServerDialog(index: Int)' droid-src/app/src/main/java/com/example/launcher/DroidLauncherUiActivity.kt
          grep -F 'private fun getSavedServers(): List<Pair<String, Int>>' droid-src/app/src/main/java/com/example/launcher/DroidLauncherUiActivity.kt
          grep -F 'private fun featuresPage()' droid-src/app/src/main/java/com/example/launcher/DroidLauncherUiActivity.kt
          grep -F 'setOnClickListener { showPage("Features") }' droid-src/app/src/main/java/com/example/launcher/DroidLauncherUiActivity.kt
          if grep -RInE 'TODO|FIXME|NotImplementedException' droid-src/app/src/main/java; then exit 1; fi
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK, NDK and CMake incrementally
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          required=("platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1")
          installed="$($SDKMANAGER --list_installed 2>/dev/null || true)"
          missing=()
          for pkg in "${required[@]}"; do
            if ! grep -Fq "${pkg}" <<< "$installed"; then missing+=("$pkg"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            timeout 25m "$SDKMANAGER" "${missing[@]}"
          else
            echo 'All required Android SDK packages are already installed.'
          fi
          "$SDKMANAGER" --list_installed | grep -E 'platform-tools|platforms;android-36|build-tools;36.0.0|ndk;27.2.12479018|cmake;3.22.1'
      - name: Set up Gradle 9.6.0 directly
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          validate-wrappers: false
      - name: Validate Gradle project
        working-directory: droid-src
        run: |
          set -euo pipefail
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          gradle --version
      - name: Run Android Lint
        working-directory: droid-src
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:lintDebug 2>&1 | tee ../artifacts/build/lintDebug.log
          status=${PIPESTATUS[0]}
          echo "LINT_EXIT=$status"
          echo '--- LINT REPORT SUMMARY ---'
          if [ -f app/build/reports/lint-results-debug.txt ]; then sed -n '1,240p' app/build/reports/lint-results-debug.txt; fi
          if [ -f app/build/reports/lint-results-debug.xml ]; then grep -o '<issue[^>]*severity="error"[^>]*' app/build/reports/lint-results-debug.xml | head -80 || true; fi
          find app/build/reports -type f -maxdepth 4 -print 2>/dev/null | sort | head -100 || true
          exit "$status"
      - name: Run unit tests
        working-directory: droid-src
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee ../artifacts/build/testDebugUnitTest.log
      - name: Build Droid Launcher debug APK
        working-directory: droid-src
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ../artifacts/build/assembleDebug.log
      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK=droid-src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" artifacts/apk/Droid-Launcher-Step257-debug.apk
          sha256sum "$APK" | tee artifacts/apk/SHA256SUMS.txt
          python3 tools/ci/verify_runtime_preflight.py "$APK" | tee artifacts/build/runtime-preflight.txt
      - name: Verify APK package and signature structure
        shell: bash
        run: |
          set -euo pipefail
          APK=droid-src/app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          export PATH="$BUILD_TOOLS:$PATH"
          aapt2 dump badging "$APK" | tee artifacts/build/apk-badging.txt
          grep -F "package: name='com.craftdroid.launcher'" artifacts/build/apk-badging.txt
          apksigner verify --verbose "$APK" | tee artifacts/build/apk-signature.txt
          zipalign -c -P 16 -v 4 "$APK" | tee artifacts/build/apk-zipalign.txt
          unzip -l "$APK" > artifacts/build/apk-contents.txt
          grep -Eq '[[:space:]]AndroidManifest.xml$' artifacts/build/apk-contents.txt
          grep -Eq '[[:space:]]classes(2)?\.dex$' artifacts/build/apk-contents.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Droid-Launcher-Step257-debug
          path: artifacts/apk/*
          if-no-files-found: error
      - name: Archive generated source on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d droid-src ]; then tar -czf artifacts/build/generated-source.tgz --exclude='droid-src/.gradle' --exclude='droid-src/app/build' droid-src; fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Droid-Launcher-Step257-diagnostics
          path: |
            artifacts/build/**
            droid-src/app/build/reports/**
            droid-src/app/build/test-results/**
          if-no-files-found: ignore