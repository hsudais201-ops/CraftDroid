name: Step 283 - Commit-bound Real Minecraft Android Boot

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Commit SHA to boot-test; defaults to the selected workflow commit'
        required: false
        type: string
      apk_build_run_id:
        description: 'Successful Step200 authoritative APK build run ID; optional auto-discovery by source SHA'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: step283-real-boot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Select exact source commit
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA='${{ inputs.source_sha }}'
          if [ -z "$TARGET_SHA" ]; then TARGET_SHA="$GITHUB_SHA"; fi
          SOURCE_RUN_ID='${{ inputs.apk_build_run_id }}'
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"
          printf '%s\n' "$TARGET_SHA" > target-sha.txt

      - name: Wait for successful Step200 authoritative APK for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_RUN_ID" ]; then
            for attempt in $(seq 1 120); do
              SOURCE_RUN_ID="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=$TARGET_SHA&per_page=100" \
                --jq '.workflow_runs[] | select(.name == "Step 200 - Droid Launcher authoritative build" and .head_sha == "'"$TARGET_SHA"'" and .conclusion == "success") | .id' \
                | head -n1)"
              if [ -n "$SOURCE_RUN_ID" ]; then
                break
              fi
              echo "Waiting for successful Step200 authoritative APK build for $TARGET_SHA (poll $attempt/120)."
              sleep 15
            done
          fi
          test -n "$SOURCE_RUN_ID"
          RUN_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$SOURCE_RUN_ID")"
          test "$(printf '%s' "$RUN_JSON" | jq -r '.conclusion // empty')" = success
          test "$(printf '%s' "$RUN_JSON" | jq -r '.head_sha // empty')" = "$TARGET_SHA"
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"
          printf '%s\n' "$SOURCE_RUN_ID" > source-run-id.txt

      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Materialize real Minecraft 1.21.1 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/fixture
          CRAFTDROID_FIXTURE_DIR="$GITHUB_WORKSPACE/artifacts/fixture" \
            python3 tools/ci/verify_minecraft_install_fixture.py | tee artifacts/fixture/fixture-result.txt
          test -s artifacts/fixture/versions/1.21.1/1.21.1.jar
          test -s artifacts/fixture/versions/1.21.1/1.21.1.json
          test -s artifacts/fixture/assets/indexes/*.json
          find artifacts/fixture/libraries -type f -print -quit | grep -q .

      - name: Download exact Step200 APK artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/apk
          found="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.name == "Droid-Launcher-Step253-debug") and .expired==false) | .id' \
            | head -n1)"
          test -n "$found"
          printf '%s\n' "$found" > artifacts/apk/artifact-id.txt
          printf '%s\n' "$SOURCE_RUN_ID" > artifacts/apk/source-run-id.txt
          printf '%s\n' "$TARGET_SHA" > artifacts/apk/source-sha.txt
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$found/zip" > artifacts/apk/artifact.zip
          unzip -q artifacts/apk/artifact.zip -d artifacts/apk
          APK="$(find artifacts/apk -type f -name '*.apk' -print -quit)"
          test -s "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          sha256sum "$APK" | tee artifacts/apk/sha256.txt

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "build-tools;36.0.0" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Install emulator host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          ldconfig -p | grep -q 'libpulse.so.0'

      - name: Preflight APK for x86_64 emulator
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee artifacts/apk/badging.txt
          PACKAGE="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" artifacts/apk/badging.txt | head -n1)"
          ACTIVITY="$(sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" artifacts/apk/badging.txt | head -n1)"
          test -n "$PACKAGE"
          test -n "$ACTIVITY"
          unzip -l "$APK" | tee artifacts/apk/contents.txt
          grep -q 'lib/x86_64/libcraftdroidbridge.so' artifacts/apk/contents.txt
          printf '%s\n' "$PACKAGE" > artifacts/apk/package.txt
          printf '%s\n' "$ACTIVITY" > artifacts/apk/activity.txt

      - name: Run real Minecraft boot harness on Android 35 x86_64
        shell: bash
        env:
          ANDROID_AVD_HOME: ${{ env.HOME }}/.android/avd
        run: |
          set -euo pipefail
          mkdir -p artifacts/runtime "$ANDROID_AVD_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"; fi
          AVD_NAME="craftdroid-step368"
          EMULATOR_BIN="$ANDROID_HOME/emulator/emulator"
          ADB="$ANDROID_HOME/platform-tools/adb"
          test -x "$EMULATOR_BIN"
          test -x "$ADB"

          echo 'no' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force \
            -n "$AVD_NAME" \
            -k 'system-images;android-35;google_apis;x86_64' \
            -d 'pixel_2'
          printf '%s\n' 'hw.cpu.ncore=2' 'hw.ramSize=2048M' 'hw.heapSize=512M' 'disk.dataPartition.size=4G' >> "$ANDROID_AVD_HOME/$AVD_NAME.avd/config.ini"

          "$ADB" kill-server >/dev/null 2>&1 || true
          "$ADB" start-server
          LOG="$GITHUB_WORKSPACE/artifacts/runtime/emulator.log"
          set +e
          "$EMULATOR_BIN" \
            -port 5554 \
            -avd "$AVD_NAME" \
            -no-window \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -noaudio \
            -no-boot-anim \
            -no-metrics \
            -accel off > >(tee "$LOG") 2>&1 &
          EMU_PID=$!
          set -e
          echo "$EMU_PID" > artifacts/runtime/emulator-pid.txt

          cleanup() {
            set +e
            "$ADB" -s emulator-5554 emu kill >/dev/null 2>&1 || true
            kill "$EMU_PID" >/dev/null 2>&1 || true
            wait "$EMU_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          STATE=''
          for attempt in $(seq 1 720); do
            STATE="$($ADB -s emulator-5554 get-state 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$STATE" = 'device' ]; then
              echo "ADB device online after $attempt polling intervals." | tee artifacts/runtime/adb-online.txt
              break
            fi
            if ! kill -0 "$EMU_PID" >/dev/null 2>&1; then
              echo 'Emulator process exited before ADB became online.' >&2
              tail -n 200 "$LOG" >&2 || true
              exit 1
            fi
            if (( attempt % 15 == 0 )); then
              echo "Waiting for ADB device (poll $attempt/720, state=${STATE:-unknown})."
              "$ADB" kill-server >/dev/null 2>&1 || true
              "$ADB" start-server >/dev/null 2>&1 || true
            fi
            sleep 2
          done
          test "$STATE" = 'device'

          for attempt in $(seq 1 360); do
            BOOTED="$($ADB -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$BOOTED" = '1' ]; then
              echo "Android sys.boot_completed=1 after poll $attempt." | tee artifacts/runtime/android-boot-complete.txt
              break
            fi
            sleep 2
          done
          test "${BOOTED:-}" = '1'

          for attempt in $(seq 1 60); do
            READY="$($ADB -s emulator-5554 shell sh -c 'echo ready' 2>/dev/null | tr -d '\r\n' || true)"
            STATE="$($ADB -s emulator-5554 get-state 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$STATE" = 'device' ] && [ "$READY" = 'ready' ]; then
              echo 'ADB shell readiness confirmed.' | tee artifacts/runtime/adb-ready.txt
              break
            fi
            sleep 2
          done
          test "${STATE:-}" = 'device'
          test "${READY:-}" = 'ready'

          "$ADB" -s emulator-5554 shell getprop ro.product.cpu.abi | tee artifacts/runtime/emulator-abi.txt
          "$ADB" -s emulator-5554 shell getprop ro.build.version.sdk | tee artifacts/runtime/emulator-api.txt
          "$ADB" -s emulator-5554 shell settings put global window_animation_scale 0 >/dev/null 2>&1 || true
          "$ADB" -s emulator-5554 shell settings put global transition_animation_scale 0 >/dev/null 2>&1 || true
          "$ADB" -s emulator-5554 shell settings put global animator_duration_scale 0 >/dev/null 2>&1 || true

          bash tools/ci/real_minecraft_boot_step182.sh "$APK" artifacts/runtime artifacts/fixture

      - name: Upload real boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CraftDroid-step283-real-boot
          path: |
            artifacts/runtime/**
            artifacts/apk/**
            artifacts/fixture/fixture-result.txt
          if-no-files-found: ignore
