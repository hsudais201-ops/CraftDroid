name: Step 200 - Droid Launcher authoritative build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: droid-launcher-authoritative-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate CI helper scripts
        run: python3 -m compileall -q tools/ci
      - name: Prepare generated launcher source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf droid-src artifacts
          mkdir -p droid-src artifacts/build artifacts/apk
          unzip -q CraftDroid_Launcher_2.4_GitHubActions_Step153.zip -d droid-src
          if [ ! -f droid-src/gradlew ]; then
            ROOT="$(find droid-src -type f -name gradlew -print -quit | xargs -r dirname)"
            test -n "$ROOT"
            shopt -s dotglob
            mv "$ROOT"/* droid-src/
            rmdir "$ROOT"
          fi
          mkdir -p droid-src/app/src/main/java/com/example/launcher
          cp -f app/src/main/java/com/example/launcher/LaunchArgumentResolver.kt droid-src/app/src/main/java/com/example/launcher/LaunchArgumentResolver.kt
          cp -f app/src/main/java/com/example/launcher/LaunchArgumentsValidator.kt droid-src/app/src/main/java/com/example/launcher/LaunchArgumentsValidator.kt
          cp -f app/src/main/java/com/example/launcher/LaunchArtifactResolver.kt droid-src/app/src/main/java/com/example/launcher/LaunchArtifactResolver.kt
          cp -f app/src/main/java/com/example/launcher/MinecraftStorageResolver.kt droid-src/app/src/main/java/com/example/launcher/MinecraftStorageResolver.kt
          cp -f app/src/main/java/com/example/launcher/MinecraftVersionInstallManager.kt droid-src/app/src/main/java/com/example/launcher/MinecraftVersionInstallManager.kt
          cp -f app/src/main/java/com/example/launcher/MinecraftLaunchPaths.kt droid-src/app/src/main/java/com/example/launcher/MinecraftLaunchPaths.kt
          cp -f app/src/main/java/com/example/launcher/MinecraftLaunchCommandBuilder.kt droid-src/app/src/main/java/com/example/launcher/MinecraftLaunchCommandBuilder.kt
          cp -f app/src/main/java/com/example/launcher/MinecraftLaunchHandoff.kt droid-src/app/src/main/java/com/example/launcher/MinecraftLaunchHandoff.kt
          cp -f app/src/main/java/com/example/launcher/MinecraftLaunchHandoffValidator.kt droid-src/app/src/main/java/com/example/launcher/MinecraftLaunchHandoffValidator.kt
          cp -f app/src/main/java/com/example/logs/MinecraftProcessMonitor.kt droid-src/app/src/main/java/com/example/logs/MinecraftProcessMonitor.kt
          cp -f app/src/main/java/com/example/renderer/PerformanceProfile.kt droid-src/app/src/main/java/com/example/renderer/PerformanceProfile.kt
          cp -f app/src/main/java/com/example/renderer/MinecraftPerformanceTuner.kt droid-src/app/src/main/java/com/example/renderer/MinecraftPerformanceTuner.kt
      - name: Normalize Gradle settings for CI
        shell: bash
        run: |
          set -euo pipefail
          for SETTINGS in droid-src/settings.gradle.kts droid-src/settings.gradle; do
            if [ -f "$SETTINGS" ]; then
              sed -i '/org\.gradle\.toolchains\.foojay-resolver-convention/d' "$SETTINGS"
            fi
          done
      - name: Apply Droid Launcher branding
        run: python3 tools/ci/apply_droid_launcher_branding.py droid-src
      - name: Apply Steps 153-155 base repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/repair_step153.py droid-src
          python3 tools/ci/repair_step154_tests.py droid-src
          python3 tools/ci/repair_step155_cpp.py droid-src
      - name: Apply Step 177 World Manager integration
        run: python3 tools/ci/apply_step177_world_manager.py droid-src
      - name: Apply Step 202 Kotlin compile repairs
        run: python3 tools/ci/repair_step202_kotlin.py droid-src
      - name: Apply Step 205 UI generation
        run: python3 tools/ci/apply_step205_zalith_style_ui.py droid-src
      - name: Repair Step 205 UI wiring
        run: python3 tools/ci/repair_step205_ui.py droid-src
      - name: Apply Step 207 home server panel
        run: python3 tools/ci/repair_step207_server_ui.py droid-src
      - name: Apply Step 209 multi-server management
        run: python3 tools/ci/repair_step209_server_list.py droid-src
      - name: Apply Step 210 selected-server launch integration
        run: python3 tools/ci/repair_step210_server_launch.py droid-src
      - name: Apply Step 211 Minecraft server status query
        run: python3 tools/ci/repair_step211_minecraft_server_query.py droid-src
      - name: Apply Step 212 server status and latency UI
        run: python3 tools/ci/repair_step212_server_ui.py droid-src
      - name: Apply Step 213 server cards
        run: python3 tools/ci/repair_step213_server_cards.py droid-src
      - name: Apply Step 214 server detail
        run: python3 tools/ci/repair_step214_server_detail.py droid-src
      - name: Apply Step 215 launch feedback
        run: python3 tools/ci/repair_step215_launch_feedback.py droid-src
      - name: Apply Step 216 launch progress
        run: python3 tools/ci/repair_step216_launch_progress.py droid-src
      - name: Apply Steps 217-220 Java/runtime binding
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/repair_step217_java_runtime_ui.py droid-src
          python3 tools/ci/repair_step218_java_profile.py droid-src
          python3 tools/ci/repair_step219_launch_java_binding.py droid-src
          python3 tools/ci/repair_step220_version_launch_binding.py droid-src
      - name: Apply Steps 221-230 install and launch preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/repair_step221_version_selector.py droid-src
          python3 tools/ci/repair_step222_version_install.py droid-src
          python3 tools/ci/repair_step223_install_status_ui.py droid-src
          python3 tools/ci/repair_step224_launch_preflight.py droid-src
          python3 tools/ci/repair_step225_launch_paths.py droid-src
          python3 tools/ci/repair_step226_storage_root.py droid-src
          python3 tools/ci/repair_step227_library_rules.py droid-src
          python3 tools/ci/repair_step228_install_resilience.py droid-src
          python3 tools/ci/repair_step229_install_progress_ui.py droid-src
          python3 tools/ci/repair_step230_complete_launch_preflight.py droid-src
      - name: Apply Steps 231-236 launch handoff and trust hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/repair_step231_launch_handoff.py droid-src
          python3 tools/ci/repair_step232_launch_handoff_consumer.py droid-src
          python3 tools/ci/repair_step234_handoff_validation_launch_gate.py droid-src
          python3 tools/ci/repair_step235_launch_runtime_guard.py droid-src
          python3 tools/ci/repair_step236_download_trust.py droid-src
      - name: Verify all hardened contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/verify_minecraft_launch_contract.py droid-src
          python3 tools/ci/verify_step233_handoff_validator.py droid-src
          python3 tools/ci/verify_step235_audit.py droid-src
          python3 tools/ci/verify_step236_download_trust.py droid-src
          if grep -RInE 'TODO|FIXME|NotImplementedException' droid-src/app/src/main/java; then
            echo 'Unfinished implementation marker found in generated launcher source.' >&2
            exit 1
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up Gradle 9.6.0 directly
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          validate-wrappers: false
      - name: Validate Gradle project
        working-directory: droid-src
        run: gradle --no-daemon --stacktrace :app:tasks --all
      - name: Run unit tests
        working-directory: droid-src
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build Droid Launcher debug APK
        working-directory: droid-src
        run: gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ../artifacts/build/assembleDebug.log
      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK=droid-src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" artifacts/apk/Droid-Launcher-Step236-debug.apk
          sha256sum "$APK" | tee artifacts/apk/SHA256SUMS.txt
          python3 tools/ci/verify_runtime_preflight.py "$APK" | tee artifacts/build/runtime-preflight.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Droid-Launcher-Step236-debug
          path: artifacts/apk/*
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Droid-Launcher-Step236-diagnostics
          path: |
            artifacts/build/**
            droid-src/app/build/reports/**
          if-no-files-found: ignore
